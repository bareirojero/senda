[package]
name = "senda"
version = "1.2.0"
description = "Senda — hub de captura rápida hacia Notion"
authors = ["Jerónimo Bareiro"]
edition = "2021"

[lib]
# Android/iOS cargan la app como biblioteca nativa
name = "senda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
